<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Arka Plan: Tam Beyaz -->
  <rect width="500" height="500" fill="#FFFFFF"/>

  <!-- Logo Grubu -->
  <g stroke="#215EAC" stroke-width="30" stroke-linecap="round" fill="none">
    
    <!-- Üst Yatay Çizgi -->
    <line x1="60" y1="165" x2="440" y2="165" />
    
    <!-- Alt Yatay Çizgi -->
    <line x1="60" y1="315" x2="440" y2="315" />

    <!-- Dış 'U' / Lir Formu (Kaph Harfinin Dış Çerçevesi) -->
    <!-- Üstten başlar, aşağı iner, yumuşak bir yay (arc) çizer ve tekrar yukarı çıkar -->
    <path d="M 155,110 L 135,290 A 115 120 0 0 0 365 290 L 345,110" />

    <!-- İçteki Üç Dikey Çizgi (Lir Telleri / Avuç İçi Çizgileri) -->
    <line x1="200" y1="110" x2="200" y2="360" /> <!-- Sol Çizgi -->
    <line x1="250" y1="110" x2="250" y2="360" /> <!-- Merkez Çizgi -->
    <line x1="300" y1="110" x2="300" y2="360" /> <!-- Sağ Çizgi -->
    
  </g>
</svg>
